name: Compilar APK Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tools/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Verificar el paquete WebAssembly
        run: |
          test -s web/model/edge-impulse-standalone.js || (echo 'Falta el JS exportado de Edge Impulse' && exit 1)
          test -s web/model/edge-impulse-standalone.wasm || (echo 'Falta el WASM exportado de Edge Impulse' && exit 1)
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx cap add android
      - name: Añadir permiso de micrófono
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          if 'android.permission.RECORD_AUDIO' not in s:
              s=s.replace('<application', '<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <application', 1)
          p.write_text(s)
          PY
      - run: npx cap sync android
      - name: Compilar APK de depuración
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: luma-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
