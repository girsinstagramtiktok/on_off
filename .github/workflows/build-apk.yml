
name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tools/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Verificar modelo Edge Impulse
        run: |
          test -s web/model/edge-impulse-standalone.js || (echo 'Falta el archivo JS de Edge Impulse' && exit 1)
          test -s web/model/edge-impulse-standalone.wasm || (echo 'Falta el archivo WASM de Edge Impulse' && exit 1)

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Preparar aplicacion web
        run: npm run build

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Configurar permiso de microfono
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()

          if 'android.permission.RECORD_AUDIO' not in s:
              s = s.replace(
                  '<application',
                  '<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <application',
                  1
              )

          p.write_text(s)
          PY

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: luma-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
